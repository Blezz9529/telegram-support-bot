# Nginx конфиг для виджета
# Скопируй это в /etc/nginx/sites-available/widget

server {
    listen 80;
    server_name 94.103.88.196;

    # Виджет
    location /widget {
        alias /root/telegram-support-bot/widget/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Real-time logs UI
    location = /logs.html {
        alias /root/telegram-support-bot/widget/logs.html;
    }

    # API виджета (прокси на FastAPI)
    location /api {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE log stream
    location /api/logs/stream {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # WebSocket для виджета
    location /api/widget/ws {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
